<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Yandex Food Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%}
    #map{height:100%}
    .panel{position:fixed;top:10px;right:10px;z-index:1000;background:#fff;padding:10px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.2);max-width:260px;font:13px sans-serif}
    .panel h3{color:#e74c3c;margin:0 0 3px}
    .search{width:100%;padding:5px;border:1px solid #ccc;border-radius:4px;margin-top:5px;font-size:13px}
    .search:focus{border-color:#e74c3c;outline:0}
    .status{font-size:11px;color:#999;margin-top:2px;min-height:14px}
    .clear{display:none;color:#e74c3c;cursor:pointer;font-size:12px;margin-top:2px}
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="panel">
    <h3>🍕 Yandex Food</h3>
    <span id="count" style="font-size:11px;color:#999">23M orders</span>
    <input class="search" id="search" placeholder="Name, phone, address…" autocomplete="off">
    <div class="status" id="status"></div>
    <div class="clear" id="clear" onclick="clearSearch()">✕ Clear</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    const map = L.map('map').setView([55.76, 37.64], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);

    const clusterGroup = L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 50 });
    map.addLayer(clusterGroup);

    const icon = L.divIcon({
      className: '',
      html: '<div style="width:10px;height:10px;background:#e74c3c;border-radius:50%;border:2px solid #fff"></div>',
      iconSize: [14, 14],
      iconAnchor: [7, 7],
    });

    function escape(s) {
      if (!s) return '';
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    }

    function getAddress(o) {
      return [o.city, o.street, o.house].filter(Boolean).join(', ');
    }

    function buildPopup(o) {
      const parts = [];
      if (o.name) parts.push('<b>' + escape(o.name) + '</b><br>');
      if (o.date) parts.push(escape(o.date).slice(0, 10) + '<br>');
      const addr = getAddress(o);
      if (addr) parts.push(escape(addr) + '<br>');
      if (o.phone) parts.push(escape(o.phone));
      return parts.join('');
    }

    function doSearch() {
      const q = document.getElementById('search').value.trim();
      if (!q) { clearSearch(); return; }

      const statusEl = document.getElementById('status');
      const clearEl = document.getElementById('clear');
      statusEl.textContent = '…';
      clearEl.style.display = 'block';

      fetch('/search?q=' + encodeURIComponent(q))
        .then(r => r.json())
        .then(data => {
          const results = data.results || [];
          clusterGroup.clearLayers();
          document.getElementById('count').textContent = results.length;

          if (!results.length) {
            statusEl.textContent = '0 found';
            return;
          }

          const markers = [];
          results.forEach(o => {
            const lat = parseFloat(o.lat);
            const lon = parseFloat(o.lon);
            if (isNaN(lat) || isNaN(lon)) return;

            const m = L.marker([lat, lon], { icon }).bindPopup(buildPopup(o));
            clusterGroup.addLayer(m);
            markers.push(m);
          });

          statusEl.textContent = 'Found ' + results.length;

          if (markers.length === 1) {
            map.setView(markers[0].getLatLng(), 15);
            markers[0].openPopup();
          } else if (markers.length > 1) {
            map.fitBounds(L.featureGroup(markers).getBounds().pad(0.1));
          }
        })
        .catch(() => { statusEl.textContent = 'Error'; });
    }

    function clearSearch() {
      document.getElementById('search').value = '';
      document.getElementById('clear').style.display = 'none';
      document.getElementById('status').textContent = '';
      clusterGroup.clearLayers();
      document.getElementById('count').textContent = '23M orders';
      map.setView([55.76, 37.64], 10);
    }

    // Debounced search on input
    let debounceTimer;
    document.getElementById('search').addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(doSearch, 400);
    });

    clearSearch();
  </script>
</body>
</html>
